# Vector Toolset - GRUB2 boot menu
#
# This is the branded multiboot menu ("our own Ventoy"). WinPE is the flagship
# entry and boots natively (GRUB chainloads its Windows boot manager). The Linux
# tools boot from their ISO files via GRUB loopback.
#
# Partition labels this config expects (created by Deploy-USB.ps1):
#   VECTORPE   - small FAT32/NTFS partition with the WinPE media (bootmgr, BCD,
#                sources\boot.wim, EFI\Microsoft\Boot\bootmgfw.efi)
#   VECTORDATA - the big exFAT data partition; holds tools\ and payload\*.iso
#
# All kernel, initrd, and squashfs paths below were verified against the actual
# ISO contents (via 7z listings and each ISO's own boot config) for the pinned
# versions in build\payload.json. Re-verify when bumping an ISO version.

set timeout=-1
set default=0

# Modules
insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod ntfs
insmod exfat
insmod iso9660
insmod loopback
insmod chain
insmod ntldr
insmod search
insmod search_label

# Locate the partitions by label
search --no-floppy --label VECTORPE   --set=winpe
search --no-floppy --label VECTORDATA --set=data

# Graphical themed menu. Load the font and theme from the VECTORPE device
# explicitly (found by the search above). grub-mkstandalone pins $prefix to its
# internal memdisk, so $prefix/fonts/... does not exist on the stick and loadfont
# would fail - which drops gfxterm to a plain text menu.
if loadfont (${winpe})/EFI/BOOT/fonts/unicode.pf2 ; then
  set gfxmode=auto
  terminal_output gfxterm
  set theme=(${winpe})/EFI/BOOT/theme/theme.txt
fi

# --- WinPE (native boot) ---
menuentry "Vector Toolset  -  WinPE diagnostic environment" --class windows {
  insmod part_gpt
  insmod fat
  insmod chain
  # Set root to the VECTORPE partition so the Windows boot manager loads relative
  # to it and finds its BCD and \sources\boot.wim.
  search --no-floppy --label VECTORPE --set=root
  if [ "${grub_platform}" = "efi" ]; then
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
  else
    ntldr /bootmgr
  fi
  boot
}

# --- Clonezilla (Debian-live loopback pattern - reliable) ---
menuentry "Clonezilla  -  full disk cloning" --class linux {
  set iso=/payload/clonezilla.iso
  loopback loop (${data})${iso}
  linux (loop)/live/vmlinuz boot=live union=overlay username=user config components quiet noswap edd=on nomodeset nodmraid locales= keyboard-layouts= net.ifnames=0 nosplash noprompt ocs_live_run="ocs-live-general" ocs_live_extra_param="" ocs_live_batch=no findiso=${iso}
  initrd (loop)/live/initrd.img
}

# --- GParted Live (Debian-live loopback pattern - reliable) ---
menuentry "GParted Live  -  partition editor" --class linux {
  set iso=/payload/gparted.iso
  loopback loop (${data})${iso}
  linux (loop)/live/vmlinuz boot=live union=overlay username=user config components quiet noswap noeject nomodeset locales= keyboard-layouts= net.ifnames=0 nosplash findiso=${iso}
  initrd (loop)/live/initrd.img
}

# --- Memtest86+ (hybrid x86_64 build; the same file serves UEFI and BIOS) ---
# memtest.efi and memtest.bin are byte-identical copies of the memtest86+ 8.x
# hybrid binary (mt86p_810_x86_64): a valid PE32+ EFI app and a BIOS boot image.
menuentry "Memtest86+  -  RAM test" --class memtest {
  if [ "${grub_platform}" = "efi" ]; then
    chainloader (${data})/payload/memtest.efi
  else
    linux16 (${data})/payload/memtest.bin
  fi
}

# --- SystemRescue (hosts ddrescue, chntpw, testdisk, ntfs tools) ---
# Verified against the 13.02 ISO: kernel and squashfs live under
# sysresccd/boot/x86_64/. img_loop points its loader at the ISO on VECTORDATA.
menuentry "SystemRescue  -  ddrescue, chntpw, recovery shell" --class linux {
  set iso=/payload/systemrescue.iso
  loopback loop (${data})${iso}
  linux (loop)/sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd img_dev=/dev/disk/by-label/VECTORDATA img_loop=${iso} earlymodules=loop copytoram
  initrd (loop)/sysresccd/boot/x86_64/sysresccd.img
}

# --- ShredOS (secure wipe, buildroot-based; rootfs is embedded in the kernel) ---
# Verified against the ISO's own grub.cfg: single bzImage, no separate initrd.
menuentry "ShredOS  -  certified drive wipe" --class linux {
  set iso=/payload/shredos.iso
  loopback loop (${data})${iso}
  linux (loop)/boot/bzImage console=tty3 loglevel=3
}

menuentry " " { true }
menuentry "Reboot"   { reboot }
menuentry "Shut down" { halt }
