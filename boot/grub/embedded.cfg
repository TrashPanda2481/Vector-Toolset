# Vector Toolset - embedded GRUB config
# This is baked into grubx64.efi by grub-mkstandalone. It runs first, locates
# the VECTORPE partition by label, then loads the real menu (grub.cfg).
search --no-floppy --label VECTORPE --set=root
set prefix=($root)/EFI/BOOT
configfile ($root)/EFI/BOOT/grub.cfg
